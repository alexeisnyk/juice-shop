name: Snyk Security Demo
on:
  push:
  workflow_dispatch:

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master

      - name: Point the CLI at the SNYK-US-02 tenant
        run: snyk config environment SNYK-US-02 --no-check

      - name: Snyk Code
        continue-on-error: true
        run: snyk code test --severity-threshold=high --report

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Snyk Open Source
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk Open Source monitor
        continue-on-error: true
        run: snyk monitor --all-projects

      - name: Build the container image
        run: docker build -t juice-shop:demo .

      - name: Snyk Container
        continue-on-error: true
        run: snyk container test juice-shop:demo --file=Dockerfile --severity-threshold=high

      - name: Snyk Container monitor
        continue-on-error: true
        run: snyk container monitor juice-shop:demo --file=Dockerfile

      - name: Snyk IaC
        continue-on-error: true
        run: snyk iac test . --severity-threshold=high --report